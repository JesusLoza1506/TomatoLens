name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      build-debug:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Instalar dependencias fijadas
        run: flutter pub get --enforce-lockfile

      - name: Analizar código
        run: flutter analyze --no-pub

      - name: Ejecutar pruebas Flutter
        run: flutter test --no-pub -r expanded

      - name: Compilar APK de prueba
        if: ${{ github.event_name != 'push' || github.ref_type != 'tag' || inputs.build-debug }}
        run: |
          flutter config --jdk-dir "$JAVA_HOME"
          flutter build apk --debug --no-pub

      - name: Guardar APK de prueba
        if: ${{ github.event_name != 'push' || github.ref_type != 'tag' || inputs.build-debug }}
        uses: actions/upload-artifact@v4
        with:
          name: tomatolens-debug-${{ github.sha }}
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
