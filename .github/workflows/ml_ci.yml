name: ML CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TF_CPP_MIN_LOG_LEVEL: '2'
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Instalar dependencias de ML
        run: python -m pip install -r ml/requirements.txt

      - name: Revisar estilo y errores con Ruff
        run: python -m ruff check ml

      - name: Probar pipeline y modelo móvil empaquetado
        run: python -m pytest ml/tests -q --junitxml=ci-results/ml-tests.xml

      - name: Guardar reporte de pruebas
        if: ${{ !cancelled() && hashFiles('ci-results/ml-tests.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tomatolens-ml-tests-${{ github.sha }}
          path: ci-results/ml-tests.xml
          if-no-files-found: error
          retention-days: 14
