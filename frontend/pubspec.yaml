name: frontend
description: TomatoLens - análisis orientativo de hojas de tomate sin conexión.
publish_to: none
version: 1.2.0+3
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  tflite_flutter: ^0.11.0
  image_picker: ^1.1.2
  image: ^4.1.7
  crypto: ^3.0.6
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/logo.png

# Launcher generation: run dart run flutter_launcher_icons from frontend/.
# Full supplied logo; opaque light background keeps dark green legible.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#F6F7F2"
  adaptive_icon_foreground: assets/images/logo.png
  adaptive_icon_foreground_inset: 24
  min_sdk_android: 26
